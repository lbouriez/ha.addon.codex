worker_processes 1;
pid /tmp/codex-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/codex-nginx-body;
    proxy_temp_path /tmp/codex-nginx-proxy;
    fastcgi_temp_path /tmp/codex-nginx-fastcgi;
    uwsgi_temp_path /tmp/codex-nginx-uwsgi;
    scgi_temp_path /tmp/codex-nginx-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 7681;
        client_max_body_size 10m;
        client_body_timeout 30s;
        # No exposed add-on port: HA ingress supplies authentication, as for ttyd.
        location ~ /codex-upload-(token|image)$ {
            proxy_pass http://127.0.0.1:7683/$1;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
