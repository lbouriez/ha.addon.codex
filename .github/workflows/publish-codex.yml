name: Build and publish Codex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: codex-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha.addon.codex

jobs:
  validate:
    name: Validate configuration and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 'aiohttp>=3.13,<4'
      - name: Validate add-on metadata and ownership
        id: metadata
        run: python scripts/validate.py
      - name: Test configuration and CLI selection
        run: python -B -m unittest discover -s codex/tests -v
      - name: Check shell scripts
        run: |
          for script in codex/rootfs/usr/local/bin/*; do
            if head -1 "$script" | grep -q bash; then
              bash -n "$script"
              shellcheck --severity=error "$script"
            fi
          done
      - name: Prepare native build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build and test ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Read base image from build.yaml
        id: base
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          build = yaml.safe_load(Path('codex/build.yaml').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('image=' + build['build_from'][os.environ['BUILD_ARCH']], file=output)
          PY
      - name: Build test image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          build-args: BUILD_FROM=${{ steps.base.outputs.image }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: codex
          image: ${{ matrix.image }}
          image-tags: test-${{ github.sha }}
          load: 'true'
          push: 'false'
          cosign: 'false'
          version: ${{ needs.validate.outputs.version }}
          labels: io.hass.type=addon
      - name: Load add-on AppArmor profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor
          sudo apparmor_parser -r -W codex/apparmor.txt
      - name: Smoke test terminal, HA access and confined daemon
        env:
          TEST_IMAGE: ${{ matrix.image }}:test-${{ github.sha }}
          CODEX_TEST_APPARMOR: codex
        run: python scripts/smoke.py "$TEST_IMAGE"
      - uses: actions/setup-node@v6
        if: matrix.arch == 'amd64'
        with:
          node-version: '24'
      - name: Test browser clipboard and terminal UI
        if: matrix.arch == 'amd64'
        working-directory: codex/terminal
        env:
          TEST_IMAGE: ${{ matrix.image }}:test-${{ github.sha }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Upload browser evidence
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v6
        with:
          name: terminal-browser
          path: codex/terminal/test-results/
      - name: Unload test AppArmor profile
        if: always()
        run: |
          sudo dmesg | grep -E 'apparmor="DENIED".*profile="codex"' || true
          sudo apparmor_parser -R codex/apparmor.txt
      - name: Publish tested image
        if: github.repository == 'lbouriez/ha.addon.codex' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          build-args: BUILD_FROM=${{ steps.base.outputs.image }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: codex
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.validate.outputs.version }}
            latest
          push: 'true'
          skip-existing: ${{ needs.validate.outputs.version }}
          version: ${{ needs.validate.outputs.version }}
          labels: io.hass.type=addon

  manifest:
    name: Publish multi-arch manifest
    if: github.repository == 'lbouriez/ha.addon.codex' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest after both architectures pass
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.validate.outputs.version }}
            latest
          skip-existing: ${{ needs.validate.outputs.version }}
